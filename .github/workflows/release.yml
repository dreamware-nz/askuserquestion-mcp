name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Verify
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Build release binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in \
              darwin/amd64 darwin/arm64 \
              linux/amd64 linux/arm64 \
              windows/amd64; do
              goos="${platform%/*}"
              goarch="${platform#*/}"
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              out="dist/askuserquestion-mcp_${TAG}_${goos}_${goarch}${ext}"
              echo "build $out"
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
                  go build -trimpath \
                  -ldflags "-s -w -X main.version=${TAG}" \
                  -o "$out" ./cmd/askuserquestion-mcp
          done
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f CHANGELOG.md ] && grep -q "^## ${TAG}" CHANGELOG.md; then
            awk -v tag="## ${TAG}" '
              $0 == tag { capture=1; next }
              capture && /^## v/ { exit }
              capture { print }
            ' CHANGELOG.md > /tmp/notes.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              dist/*
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
